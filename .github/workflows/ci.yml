name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so the lint result is reproducible instead of drifting with
  # whatever ruff version the runner happens to resolve.
  RUFF_VERSION: "0.16.4"

jobs:
  test:
    name: test (${{ matrix.layer }} / py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        layer:
          - "."
          - "enterprise-data-pipeline"
          - "data-processing-enrichment"
          - "embedding-retrieval-intelligence"
          - "orchestration-guardrails"
          - "experience-api-engagement"
          - "security-governance"
          - "observability-monitoring"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install layer
        working-directory: ${{ matrix.layer }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install API extra
        if: matrix.layer == 'experience-api-engagement'
        working-directory: ${{ matrix.layer }}
        run: python -m pip install -e ".[api]"

      - name: Run tests
        working-directory: ${{ matrix.layer }}
        run: python -m pytest -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  license-headers:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every tracked .py file carries the Apache-2.0 SPDX header
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -20 "$file" | grep -q "SPDX-License-Identifier: Apache-2.0"; then
              echo "::error file=$file::missing Apache-2.0 SPDX header"
              missing=1
            fi
          done < <(git ls-files '*.py')
          exit "$missing"

      - name: No proprietary license markers remain
        # CHANGELOG.md is excluded: it legitimately records the Apache-2.0
        # relicense and names the identifier it replaced.
        run: |
          if git grep -In "LicenseRef-Veloxs-AI-Proprietary" \
               -- '*.py' '*.toml' '*.md' ':!CHANGELOG.md'; then
            echo "::error::proprietary license marker found; Nexus is Apache-2.0"
            exit 1
          fi
          exit 0

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*
