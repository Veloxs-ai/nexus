name: Bug report
description: Report a defect or unexpected behavior in Nexus.
title: "[bug] <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. **Please do not
        use this template for security issues** — see
        [SECURITY.md](https://github.com/Veloxs-ai/nexus/blob/main/SECURITY.md).
  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is **not** a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Nexus version
      description: Output of `nexus --version`, or the commit SHA you're on.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      multiple: true
      options:
        - root (src/nexus)
        - enterprise-data-pipeline
        - data-processing-enrichment
        - embedding-retrieval-intelligence
        - orchestration-guardrails
        - experience-api-engagement
        - security-governance
        - observability-monitoring
        - docs
        - CI / packaging
        - not sure
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.7"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Smallest set of steps, config, and commands that reproduce the
        issue. Paste output, tracebacks, and relevant config fragments
        (with secrets redacted).
      render: bash
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Logs, screenshots, links to related issues, etc.
    validations:
      required: false
