version: 2
updates:
  # Python deps in each layer + the root.
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/enterprise-data-pipeline"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/data-processing-enrichment"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/embedding-retrieval-intelligence"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/orchestration-guardrails"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/experience-api-engagement"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/security-governance"
    schedule: { interval: weekly }
    labels: ["dependencies", "security"]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/observability-monitoring"
    schedule: { interval: weekly }
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # GitHub Actions versions.
  - package-ecosystem: github-actions
