[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veloxs-nexus"
version = "3.0.1"
description = "Nexus — Enterprise Intelligence Framework. Build secure, governed AI applications, retrieval systems, agents, and intelligent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Veloxs AI Inc.", email = "hello@veloxs.ai" },
]
maintainers = [
  { name = "Veloxs AI Inc.", email = "engineering@veloxs.ai" },
]
keywords = [
  "rag",
  "retrieval",
  "enterprise-ai",
  "guardrails",
  "vector-search",
  "ai-governance",
  "observability",
  "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
postgres = ["pgvector>=0.2.5", "psycopg2-binary>=2.9.9", "sqlalchemy>=2.0.0"]
yaml = ["pyyaml>=6.0.1"]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage      = "https://github.com/Veloxs-ai/nexus"
Documentation = "https://github.com/Veloxs-ai/nexus/blob/main/docs/USING_NEXUS.md"
Repository    = "https://github.com/Veloxs-ai/nexus"
Issues        = "https://github.com/Veloxs-ai/nexus/issues"
Changelog     = "https://github.com/Veloxs-ai/nexus/blob/main/CHANGELOG.md"
Security      = "https://github.com/Veloxs-ai/nexus/blob/main/SECURITY.md"

[project.scripts]
nexus = "nexus.cli:app"

[tool.setuptools.package-dir]
nexus = "src/nexus"
"nexus.pipeline" = "enterprise-data-pipeline/src/nexus_pipeline"
"nexus.processing" = "data-processing-enrichment/src/nexus_processing"
"nexus.retrieval" = "embedding-retrieval-intelligence/src/nexus_retrieval"
"nexus.guardrails" = "orchestration-guardrails/src/nexus_guardrails"
"nexus.experience" = "experience-api-engagement/src/nexus_experience"
"nexus.security" = "security-governance/src/nexus_security"
"nexus.observability" = "observability-monitoring/src/nexus_observability"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", ".venv-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pinned explicitly so the result is reproducible across ruff versions rather
# than drifting with whatever the default rule set happens to be.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3 flag ambiguous Unicode. This codebase deliberately handles
# adversarial Unicode (homoglyph and zero-width prompt-injection defenses), so
# full-width and zero-width characters in the normalization tables and their
# tests are intentional, not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Verbatim SQL DDL: wrapping these lines would change the emitted schema.
"src/nexus/database.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` / `Header(...)` in argument defaults is the documented FastAPI
# idiom, not the mutable-default bug B008 is meant to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]


[tool.ruff.lint.isort]
known-first-party = [
  "nexus",
  "nexus_pipeline",
  "nexus_processing",
  "nexus_retrieval",
  "nexus_guardrails",
  "nexus_experience",
  "nexus_security",
  "nexus_observability",
]

