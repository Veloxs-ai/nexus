[project]
name = "security-governance"
version = "0.1.0"
description = "Security, governance, and observability layer for enterprise AI platforms."
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-Veloxs-AI-Proprietary"
authors = [
  { name = "Veloxs AI Inc.", email = "hello@veloxs.ai" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=42.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage      = "https://github.com/Veloxs-ai/nexus"
Documentation = "https://github.com/Veloxs-ai/nexus/blob/main/docs/USING_NEXUS.md"
Repository    = "https://github.com/Veloxs-ai/nexus"
Issues        = "https://github.com/Veloxs-ai/nexus/issues"
Security      = "https://github.com/Veloxs-ai/nexus/blob/main/SECURITY.md"

[project.scripts]
security = "nexus_security.cli:app"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

